# Aplicación
spring.application.name=chaskipe-api
spring.config.import=optional:file:.env[.properties]

# PostgreSQL / Supabase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chaskipe}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Servidor
server.port=${PORT:8080}
# Las rutas REST incluyen explícitamente el prefijo /api para que también
# exista un endpoint público de estado en la raíz del servicio.
server.servlet.context-path=/
server.error.include-message=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/docs

# React Native / Expo
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
